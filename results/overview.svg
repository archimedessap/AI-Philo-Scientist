<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-label="UniversalTheoryGen 端到端流程">
  <style>
    .box { fill: #f5f8ff; stroke: #2d4b8b; stroke-width: 2; rx: 8; ry: 8; }
    .accent { fill: #e8f7f0; stroke: #2a8f5c; stroke-width: 2; rx: 8; ry: 8; }
    .text { font: 14px 'Helvetica Neue', Arial, sans-serif; fill: #1b2735; }
    .title { font: bold 16px 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
    .arrow { stroke: #5c6f82; stroke-width: 2.5; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5c6f82"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="20" y="26" class="title">UniversalTheoryGen（论文附件）端到端流程</text>
  <text x="20" y="48" class="text">从整理理论 → 短卡/RAG → 矛盾 → 假说 → 评估 → 论文引用摘要</text>

  <!-- Row 1 -->
  <rect x="40" y="80" width="160" height="60" class="box"/>
  <text x="60" y="108" class="title">理论 JSON</text>
  <text x="60" y="128" class="text">data/theories_v2.1</text>

  <line x1="200" y1="110" x2="250" y2="110" class="arrow"/>

  <rect x="250" y="80" width="170" height="60" class="box"/>
  <text x="270" y="108" class="title">短卡</text>
  <text x="270" y="128" class="text">pipelines/build_short_cards.py</text>

  <line x1="420" y1="110" x2="470" y2="110" class="arrow"/>

  <rect x="470" y="80" width="200" height="60" class="box"/>
  <text x="490" y="108" class="title">矛盾分析器</text>
  <text x="490" y="128" class="text">pipelines/build_conflicts.py</text>

  <line x1="670" y1="110" x2="720" y2="110" class="arrow"/>

  <rect x="720" y="80" width="210" height="60" class="box"/>
  <text x="740" y="108" class="title">假说生成</text>
  <text x="740" y="128" class="text">run_direct_synthesis.py</text>

  <!-- Row 2 -->
  <line x1="825" y1="140" x2="825" y2="180" class="arrow"/>

  <rect x="720" y="180" width="210" height="60" class="accent"/>
  <text x="740" y="208" class="title">评估</text>
  <text x="740" y="228" class="text">theory_evaluation/…</text>

  <line x1="620" y1="210" x2="720" y2="210" class="arrow"/>

  <rect x="430" y="180" width="190" height="60" class="accent"/>
  <text x="450" y="208" class="title">论文引用摘要</text>
  <text x="450" y="228" class="text">results/prior_eval_paper/…</text>

  <line x1="250" y1="210" x2="430" y2="210" class="arrow"/>

  <rect x="40" y="180" width="210" height="60" class="accent"/>
  <text x="60" y="208" class="title">评测细节</text>
  <text x="60" y="228" class="text">results/prior_theories_evaluation/…</text>

  <!-- Down arrows from Hypothesis to Eval/Results -->
  <line x1="825" y1="140" x2="620" y2="180" class="arrow" />
  <line x1="825" y1="140" x2="250" y2="180" class="arrow" />
</svg>
